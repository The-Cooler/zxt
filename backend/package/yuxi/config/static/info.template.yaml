# 单位信息配置文件
# 用于配置网站的基本信息、品牌信息等

# 组织信息
organization:
  name: "自学通"             # 完整组织名称
  logo: "/api/system/logo"    # Logo文件路径
  avatar: "/avatar.jpg"      # 头像文件路径（放在 web/public 目录下）
  login_bg: "/login-bg.jpg"  # 登录背景图片路径（放在 web/public 目录下）

# 项目信息
branding:
  name: "ZXT"
  title: "让自学更有计划、更有反馈"     # 系统标题
  subtitle: "整理资料、沉淀笔记、追踪进度，用 AI 陪你完成长期学习"          # 副标题（subtitles 为空时使用）
  subtitles:
    - "整理资料、沉淀笔记、追踪进度，用 AI 陪你完成长期学习"
    - "把课程资料、阅读摘录和练习记录放进同一个学习空间"
    - "围绕目标拆解计划，按主题积累知识，及时复盘薄弱点"
    - "遇到问题随时提问，让每次学习都有清晰的下一步"
    - "从零散输入到体系化掌握，持续构建自己的知识库"

features:
  - label: "资料整理"
    value: "Library"
    description: "集中保存课程资料、网页摘录和学习文档"
    icon: "docs"
  - label: "知识连接"
    value: "Map"
    description: "把概念、主题和问题串起来，形成可回顾的学习脉络"
    icon: "graph"
  - label: "AI 辅导"
    value: "Tutor"
    description: "针对资料提问、总结重点，辅助拆解学习难点"
    icon: "agent"
  - label: "学习工作区"
    value: "Workspace"
    description: "保存笔记、练习和阶段成果，方便持续复盘"
    icon: "workspace"

actions: []



# 页脚信息
footer:
